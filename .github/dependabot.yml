version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # adb-shell and androidtvremote2: the test pins follow the versions Home Assistant core
    # pins (manifest.json only sets minimums); bump them together with core.
    ignore:
      - dependency-name: adb-shell
      - dependency-name: androidtvremote2

  - package-ecosystem: npm
    directory: /card
    schedule:
      interval: weekly
    groups:
      card-dependencies:
        patterns: ["*"]
