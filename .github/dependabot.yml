version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # adb-shell and androidtvremote2 are pinned in manifest.json to the versions Home
    # Assistant core uses; bump them together with core, not on their own.
    ignore:
      - dependency-name: adb-shell
      - dependency-name: androidtvremote2

  - package-ecosystem: npm
    directory: /card
    schedule:
      interval: weekly
    groups:
      card-dependencies:
        patterns: ["*"]
