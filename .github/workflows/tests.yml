name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Integration (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # pytest-homeassistant-custom-component 0.13.375 pulls Home Assistant 2026.10.4,
          # which requires Python >= 3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Ruff lint
        run: ruff check custom_components tests

      - name: Ruff format
        run: ruff format --check custom_components tests

      - name: Pytest (Home Assistant harness, socket guard on)
        run: python -m pytest tests -q

  card:
    name: Card (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: card/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed bundle matches the build
        working-directory: .
        run: |
          # The build is byte-reproducible from LF sources (.gitattributes forces LF).
          if ! git diff --exit-code --stat -- custom_components/android_tv_pilot/frontend/android-tv-pilot-card.js; then
            echo "::error file=custom_components/android_tv_pilot/frontend/android-tv-pilot-card.js::The committed card bundle is out of date. Run 'npm run build' in card/ and commit the result."
            exit 1
          fi
