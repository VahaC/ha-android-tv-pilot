name: Feature request
description: Suggest an idea for the integration or the card
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation and what you would like to be able to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
  - type: input
    id: tv
    attributes:
      label: TV model and Android version (if relevant)
