name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.4"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Android TV Pilot version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and Android version
      placeholder: "Xiaomi Mi TV 4S 55, Android 9"
    validations:
      required: true
  - type: dropdown
    id: transports
    attributes:
      label: Connections in use
      options:
        - ADB and remote protocol
        - ADB only
    validations:
      required: true
  - type: input
    id: wake
    attributes:
      label: Wake entity (if the problem is about turning on)
      placeholder: "button.wake_the_tv (ESP32 BLE wake)"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Device page of the TV in Home Assistant, three-dot menu, "Download diagnostics".
        Attach the file here (host, serial and MAC are already redacted).
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: >-
        Enable debug logging for the integration (Settings, Devices & services,
        Android TV Pilot, "Enable debug logging"), reproduce, then paste the relevant lines.
      render: text
